macros:
- name: cents_to_dollars
  description: Count an amount in cents to dollars, with a specified number of decimal places (default is 2.)
  arguments: 
  - name: column_name
    description: "The name of the column containing the amount in cents."
    type: string
  - name: decimals
    description: "The number of decimal places to round to (default is 2)"
    type: integer
    default: 2
  returns: "A SQL expression that converts the amount from cents to dollars"
  examples:
  - description: "Convert the 'amount' column from cents to dollars with 2 decimal places"
    code: |
      {{ cents_to_dollars("amount") }}
  - description: "Convert the 'total_cents' column from cents to dollars with 4 decimal places"
    code: |
      {{ cents_to_dollars("total_cents", 4) }}